name: openreconfi

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: openreconfi
      POSTGRES_USER: openreconfi
      POSTGRES_PASSWORD: openreconfi
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreconfi -d openreconfi"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Local dev keeps secrets in Backend/.env; Portainer git stacks materialize
    # the stack's environment variables into a .env next to this compose file.
    # Both are optional so either source works on its own.
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: openreconfi
      POSTGRES_USER: openreconfi
      POSTGRES_PASSWORD: openreconfi
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
